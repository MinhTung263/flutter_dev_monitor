name: flutter_dev_monitor
description: In-app developer monitor for Flutter apps. Tracks API calls, FPS, RAM, and disk usage with a floating overlay and full dashboard. Framework-agnostic — works with GetX, Provider, Riverpod, or plain Flutter.
version: 2.5.0
homepage: https://github.com/MinhTung263/flutter_dev_monitor
repository: https://github.com/MinhTung263/flutter_dev_monitor
issue_tracker: https://github.com/MinhTung263/flutter_dev_monitor/issues

screenshots:
  - description: >
      DevMonitor Lab — Floating overlay HUD with live FPS, RAM, network latency, and API metrics.
    path: screenshots/dev_monitor_lab.png
  - description: >
      Performance Console — System RAM & storage metrics, FPS and RAM charts, API call log list.
    path: screenshots/performance_console.png
  - description: >
      Log Details (Flow Trace Timeline) — Complete timeline of route navigation and API calls.
    path: screenshots/log_flow_timeline.png
  - description: >
      Log Details (Interactive Route Map) — Visual node graph and minimap of screen route dependencies.
    path: screenshots/log_map_graph.png
  - description: >
      Log Details (Stats & Analytics) — 72h API call traffic, top visited screens, top APIs, and error distribution.
    path: screenshots/log_stats_analytics.png
  - description: >
      API Log Dashboard (Dark mode) — Dark themed API metrics dashboard.
    path: screenshots/dashboard_dark.png


environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.flutterdevmonitor.vn
        pluginClass: FlutterDevMonitorPlugin
      ios:
        pluginClass: FlutterDevMonitorPlugin

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
